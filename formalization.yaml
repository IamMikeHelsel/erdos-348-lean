      models: ["claude-opus-5-5"]
      framework: "Claude Code"
      tool_setup: >-
        An autonomous Claude Code subagent (model claude-opus-5-5) was given the formal-conjectures
        statement and Geneson's paper and wrote the proof, iterating with `lake env lean` until the
        file compiled without sorry. The subagent was orchestrated by a Claude Code session running
        claude-fable-5-1, which also packaged the project for Palomar (Mathlib v4.35.0 port, module
        system, Challenge/Solution split, Comparator configuration and metadata).
      cost:
        wall_time: "about 20 minutes of agent time for the proof, plus packaging"
        spend_usd: "subscription-based usage"
        hardware: "API-only (local Lean checks on an ARM64 workstation)"
  spend_usd: "subscription-based usage"
  notes: >-
    The human author (Mike Helsel) chose the problem and the source, directed the agents, and is
    responsible for the submission. The Lean proof text was written by the AI agent and accepted
    on the basis of kernel checking, axiom audits and Comparator, not a line-by-line human review.

fidelity:
  divergences: >-
    None relative to the formal-conjectures statement, which is reproduced verbatim (the
    Comparator configuration checks that Challenge.lean and Solution.lean state the same
    theorem). Conventions of the formal statement: sequences are monotone functions ℕ → ℕ, so
    repeated values are allowed and terms are natural numbers (zeros allowed); deleting the
    indices in a finite set s replaces the indexed terms by 0 (Function.updateFinset a s 0), so a
    deletion removes one indexed occurrence (deleting an index whose term is already 0 is
    allowed and has no effect on sums); "deleting any m terms" quantifies over all index sets of
    cardinality exactly m; completeness (IsAddCompleteNatSeq') allows finitely many exceptions.
    Relative to the paper: Geneson states Theorem 1 for non-decreasing integer sequences (terms
    may be zero or negative), counts repeated values as separate occurrences, deletes
    occurrences, and uses eventual completeness, as in Erdős and Graham. The formal statement is
    restricted to natural-number sequences; the existence direction uses the same examples
    (powers of two; Fibonacci 1, 1, 2, 3, …), and the exclusion of m ≥ 2 is proved for all
    monotone ℕ-valued sequences, including bounded ones and ones with zero terms, so the paper's
    reduction from integer to positive sequences is not needed and not formalized. The paper's
    Theorem 2 and Lemma 3 assume positive terms; the Lean versions (`central`,
    `slack_diverges`) assume a monotone, unbounded ℕ-valued sequence instead, and Lemma 3 is
    formalized with a bounded "restoration" constant C so that it applies to the reindexed
    sequence after a finite deletion.

review:
  status: "agent-reviewed"
  reviewers: ["Lean kernel and lake comparator (mechanical)", "Claude Code agents (claude-opus-5-5, claude-fable-5-1)"]
  notes: >-
    Kernel-checked; `lake comparator` (Lean v4.35.0) accepts the solution with the Lean kernel and,
    with --paranoid, also with lean4lean, nanoda, con-leche and con-ron. `#print axioms
    Erdos348.erdos_348` reports only propext, Classical.choice and Quot.sound; the Solution
    contains no sorry and no native_decide. The statement and definitions were diffed
    byte-for-byte against formal-conjectures by a second agent. The human author has not
    reviewed the proof line by line.

alignment:
  namespace: "Erdos348"
  note: >-
    Only the compared declarations (Erdos348.erdos_348, Erdos348.erdos_348.answer and the copied
    definitions) are public in Solution.lean; the auxiliary lemmas listed below are module-private
    declarations of Solution.lean, named here by their source names.
  statements:
    - source: "Geneson, Theorem 1 (deletion classification: exactly the pairs with m ≤ 1)"
      lean: "Erdos348.erdos_348"
      module: "Solution.lean (statement in Challenge.lean)"
      status: "proved"
      note: "Formal-conjectures statement; see fidelity.divergences for the ℕ-valued convention."
    - source: "Geneson, existence for m = 0 (powers of two)"
      lean: "Erdos348.two_pow_complete, Erdos348.two_pow_not_complete"
      module: "Solution.lean"
      status: "proved"
    - source: "Geneson, existence for m = 1 (Fibonacci 1, 1, 2, 3, …; Brown's criterion)"
      lean: "Erdos348.brown, Erdos348.fibSeq_one_deletion, Erdos348.fibSeq_missing, Erdos348.fibSeq_not_complete"
      module: "Solution.lean"
      status: "proved"
    - source: "Geneson, Theorem 2 (central-interval theorem)"
      lean: "Erdos348.central"
      module: "Solution.lean"
      status: "proved"
      note: "Stated for monotone, unbounded ℕ-valued sequences rather than positive ones."
    - source: "Geneson, Lemmas 6, 7, 8 (locating missing integers; states, transitions, common cut)"
      lean: "Erdos348.locate, Erdos348.gap_le_label, Erdos348.common_cut, Erdos348.transition"
      module: "Solution.lean"
      status: "proved"
    - source: "Geneson, Lemma 3 (prefix slack diverges)"
      lean: "Erdos348.slack_diverges"
      module: "Solution.lean"
      status: "proved"
    - source: "Geneson, Lemma 4 and Proposition 5 (extension of complete finite deletions)"
      lean: "Erdos348.extend_core, Erdos348.exists_complete_deletion"
      module: "Solution.lean"
      status: "proved"
    - source: "Geneson, exclusion of m ≥ 2 in Theorem 1"
      lean: "Erdos348.mem_answer_of_mem"
      module: "Solution.lean"
      status: "proved"

