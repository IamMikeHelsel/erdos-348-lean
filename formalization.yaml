# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Erdős Problem 348: deletion thresholds for complete sequences (Geneson's Theorem 1)"
  description: |
    A Lean 4 / Mathlib formalization of the solution of Erdős Problem 348, following
    J. Geneson, "Deletion thresholds and exponential examples for complete sequences"
    (arXiv:2609.25107), Theorem 1. A sequence of natural numbers is complete if every
    sufficiently large natural number is a sum of terms with distinct indices (finitely many
    exceptions are allowed). The problem asks for which pairs 0 ≤ m < n there is a
    non-decreasing sequence that remains complete after deleting any m terms but becomes
    incomplete after deleting any n terms. The main theorem `Erdos348.erdos_348` proves that
    the set of such pairs is exactly {(m, n) : m < n and m ≤ 1}.

    The statement and its definitions are copied verbatim from google-deepmind/formal-conjectures
    (FormalConjectures/ErdosProblems/348.lean). Sequences are functions a : ℕ → ℕ that are
    monotone (non-decreasing), so repeated values are allowed; deleting a finite set s of
    indices is modelled by Function.updateFinset a s 0, i.e. the indexed terms are set to 0, so
    each deletion removes one indexed occurrence and other occurrences of the same value remain;
    completeness is IsAddCompleteNatSeq', i.e. eventually every k is a sum ∑ i ∈ B, a i over a
    finite index set B.

    The constructions are the powers of two (m = 0) and the Fibonacci sequence 1, 1, 2, 3, 5, …
    (m = 1). The case m ≥ 2 is excluded by formalizing Geneson's argument for sequences with
    repeated terms: divergence of the prefix slack under single deletions (Lemma 3), the
    central-interval theorem (Theorem 2, via Lemmas 6–8 and his potential-function argument),
    the long-gap lemma for deletion-minimal sequences (Lemma 4), and the extension of complete
    finite deletions (Proposition 5). The proof uses only the standard axioms propext,
    Quot.sound and Classical.choice.
  authors: ["Mike Helsel"]
  responsible_maintainers: ["Mike Helsel"]
  license: "Apache-2.0"

